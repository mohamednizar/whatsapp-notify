[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
logfile = /var/log/odoo/odoo.log
log_level = info

# Database settings
db_host = postgres
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo_test

# Server settings
http_port = 8069
workers = 0

# Testing specific settings
test_enable = True
test_file = /var/log/odoo/test-results.txt
without_demo = False

# Module installation settings (removed - will be handled via command line)
# init = whatsapp_business
# update = all

# Security settings
admin_passwd = admin
list_db = True

# Performance settings
max_cron_threads = 0
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = -1

# Logging
log_handler = :INFO
log_db = True